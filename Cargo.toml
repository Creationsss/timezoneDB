[package]
name = "timezone-db"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.4"
tokio = { version = "1.47.1", features = ["full", "signal"] }
sqlx = { version = "0.8.6", features = [
    "postgres",
    "runtime-tokio",
    "macros",
    "chrono",
] }
redis = { version = "0.32.5", features = ["tokio-comp", "aio"] }
uuid = { version = "1.18.1", features = ["v7"] }
dotenvy = "0.15.7"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.145"
reqwest = { version = "0.12.23", features = ["json", "gzip"] }
tower-http = { version = "0.6.6", features = ["cors", "fs"] }
headers = "0.4.1"
chrono-tz = "0.10.4"
chrono = { version = "0.4", features = ["serde"] }
tower = "0.5.2"
urlencoding = "2.1.3"
thiserror = "2.0.16"
